<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Smart Parking</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">🅿️ Smart Parking</a>
  <nav><a href="signup.html">Sign up</a></nav>
</div>

<div class="container narrow">
  <div class="card">
    <h2>Welcome back</h2>
    <div id="error" class="error-msg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-amber">Log in</button>
    </form>
    <p class="hint" style="margin-top:16px;">No account yet? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
